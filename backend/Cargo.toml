[package]
name = "webrtc-backend"
version = "0.1.0"
edition = "2021"
description = "WebRTC platform backend - signaling server, auth, and device management"
authors = ["WebRTC Platform Team"]

[dependencies]
# Web framework
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
actix-ws = "0.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }

# Authentication
jsonwebtoken = "9"
argon2 = "0.5"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Error handling
thiserror = "2"

# Random
rand = "0.8"

# Crypto
sha2 = "0.10"

# Async streams
futures-util = "0.3"

[dev-dependencies]
actix-rt = "2"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
strip = true
