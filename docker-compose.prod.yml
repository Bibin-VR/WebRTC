version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: webrtc_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-webrtc}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: webrtc_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - webrtc_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-webrtc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webrtc_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - webrtc_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/bibin-vr/webrtc/webrtc-backend:latest
    container_name: webrtc_api_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-webrtc}:${DB_PASSWORD}@postgres:5432/webrtc_prod
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: 1
      REFRESH_TOKEN_EXPIRY_DAYS: 7
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      CORS_ORIGIN: https://${DOMAIN}
      RUST_LOG: info,webrtc_backend=debug
      ENVIRONMENT: production
    networks:
      - webrtc_prod_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ghcr.io/bibin-vr/webrtc/webrtc-frontend:latest
    container_name: webrtc_web_prod
    restart: unless-stopped
    networks:
      - webrtc_prod_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: webrtc_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./dhparam.pem:/etc/nginx/dhparam.pem:ro
    depends_on:
      - backend
      - frontend
    networks:
      - webrtc_prod_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  webrtc_prod_network:
    driver: bridge
