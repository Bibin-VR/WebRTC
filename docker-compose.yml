version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: webrtc_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webrtc
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webrtc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webrtc_network

  redis:
    image: redis:7-alpine
    container_name: webrtc_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webrtc_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  webrtc_network:
    driver: bridge
